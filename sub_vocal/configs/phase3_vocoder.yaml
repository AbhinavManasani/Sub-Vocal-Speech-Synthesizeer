# Phase 3 — HiFi-GAN Vocoder Fine-tuning
# Pretrained on LJSpeech, fine-tune on LRS2/LRS3 audio
# Replaces Griffin-Lim with neural vocoder for quality

_base_: "base.yaml"

phase: 3
experiment_name: "phase3_vocoder"

data:
  dataset: "lrs_audio"
  lrs2_root: "/data/LRS2-BBC"
  lrs3_root: "/data/LRS3-TED"
  sample_rate: 22050               # HiFi-GAN default
  n_mels: 80
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  segment_length: 8192             # ~0.37s segments for training

model:
  hifi_gan:
    # Generator
    upsample_rates: [8, 8, 2, 2]
    upsample_kernel_sizes: [16, 16, 4, 4]
    upsample_initial_channel: 512
    resblock_kernel_sizes: [3, 7, 11]
    resblock_dilation_sizes: [[1,3,5], [1,3,5], [1,3,5]]
    # Pretrained LJSpeech checkpoint
    pretrained_path: "checkpoints/hifigan_ljspeech.pt"

    # Multi-period discriminator
    mpd_periods: [2, 3, 5, 7, 11]
    # Multi-scale discriminator
    msd_scales: 3

training:
  batch_size: 16
  max_epochs: 100

  optimizer:
    generator:
      type: "adamw"
      lr: 2.0e-4
      betas: [0.8, 0.99]
    discriminator:
      type: "adamw"
      lr: 2.0e-4
      betas: [0.8, 0.99]

  scheduler:
    type: "exponential"
    gamma: 0.999

  loss:
    type: "gan"
    mel_loss_weight: 45.0
    feature_match_weight: 2.0
    generator_loss_weight: 1.0

  eval:
    every_n_steps: 5000
    metrics: ["pesq", "mel_distortion"]
